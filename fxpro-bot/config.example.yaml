# Copy to `config.yaml` and tune. All values here are conservative demo defaults.

# --- Instrument & timing ---
symbol: "EURUSD"          # the instrument to trade
timeframe: "M15"          # bar timeframe: M1, M5, M15, M30, H1, H4, D1
trend_timeframe: "H1"     # higher timeframe used for the trend filter
poll_seconds: 15          # how often the loop wakes to check for a new closed bar
warmup_bars: 300          # bars of history pulled for indicator calculation

# --- Strategy (EMA crossover + higher-timeframe trend filter) ---
strategy:
  ema_fast: 12
  ema_slow: 26
  trend_ema: 50           # EMA on the trend timeframe; only go long above, short below
  atr_period: 14
  atr_stop_mult: 2.0      # stop-loss distance = atr_stop_mult * ATR
  atr_target_mult: 3.0    # take-profit distance = atr_target_mult * ATR (R:R = 1.5)

# --- Risk controls (the part that keeps us alive) ---
risk:
  risk_per_trade_pct: 0.5     # % of equity risked per trade, sized from stop distance
  max_open_positions: 1       # total simultaneous positions
  one_position_per_symbol: true
  daily_max_loss_pct: 2.0     # halt NEW trades for the day if equity drops this % from day-start
  min_lot: 0.01               # broker minimum; sizing is clamped to lot step
  max_lot: 1.0                # hard cap regardless of what sizing suggests

# --- Journal ---
journal:
  db_path: "journal.sqlite"
  csv_path: "trades.csv"
